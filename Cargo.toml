# atm in Rust (T-415, docs/porting-to-rust.md): one crate per layer (docs/layered-architecture.md), so the compiler
# checks the layer rule. The rules: docs/guides/rust.md.
[workspace]
# The CLI's layers, and the atm app (T-455) on the same ones
members = ["crates/*", "app/src-tauri"]
resolver = "3"

[workspace.package]
# atm's version, the one source (T-477): the dashboard is stamped with it, and CHANGELOG.md and WHATS-NEW.md need an
# entry for it (dashboard/scripts/check-versions.mjs). The dashboard's About dialog shows the description, the author,
# the licence and the repository
version = "0.41.0"
description = "File-based task management for agentic development. Decompose requirements into tasks, execute them in loops, and watch progress on a live HTML dashboard."
authors = ["Hakan Serce <hakanserce@gmail.com>"]
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/solo-swe/agentic-task-manager"
publish = false

[workspace.dependencies]
atm-common = { path = "crates/atm-common" }
atm-fs = { path = "crates/atm-fs" }
atm-db = { path = "crates/atm-db" }
atm-vcs = { path = "crates/atm-vcs" }
atm-review = { path = "crates/atm-review" }
atm-docs = { path = "crates/atm-docs" }
atm-lib = { path = "crates/atm-lib" }
atm-api = { path = "crates/atm-api" }
# CompMD in a Tauri app (ADR-006, T-524): CompMD's own plugin serves the bundle the page's build wrote (the frames and
# the packs) on a compmd: scheme, embedded by the app's build.rs (the `build` feature). Its version is
# @compmd/sandbox's (dashboard/package.json): they are released together
tauri-plugin-compmd = "=0.8.0"
# CompMD's serving contract, which atm serve answers its bundle with as the plugin does in the app (ADR-006)
compmd-host = "=0.8.0"
clap = { version = "4.5", features = ["derive"] }
# Shell completion with atm's own values (task IDs, sprints, …), its dynamic engine (T-451, approved)
clap_complete = { version = "4.5", features = ["unstable-dynamic"] }
# The CLI's styled output (T-488, docs/cli-output-design.md; approved by Hakan): the styles, and stdout with them on or
# off by NO_COLOR, CLICOLOR_FORCE, TERM and whether it is a terminal. Both already in the tree through clap
anstyle = "1"
anstream = "1"
# The terminal's width, to cut long lines there (T-488; approved by Hakan). Its own dependencies (rustix, windows-sys)
# are in the tree already
terminal_size = "0.4"
# JSON as atm writes it (docs/porting-to-rust.md §3): keys in the order they come, so a task prints as it is stored
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
# The lock (T-445): the host name and whether a lock's owner still runs; `claim hold`'s watcher follows its shell with it
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
# The lock is released when atm is stopped with SIGTERM, as the Python atm releases it (Unix only)
signal-hook = "0.4"
# The local time zone (TZ, /etc/localtime, the system's tz database), for sprints named by the time (T-471)
jiff = "0.2"
# Tasks' IDs (ADR-007, T-538; approved by Hakan): UUIDs, version 7 (they sort by creation). Already in the tree through
# Tauri
uuid = { version = "1.29", features = ["v7"] }
# `atm service`'s server (T-449, docs/porting-to-rust.md §3): HTTP/1 on localhost; the rest of atm stays synchronous
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "macros"] }
# Windows only (T-480, approved): atm's own standard handles made non-inheritable before it starts a background
# process, so the caller's pipes close when atm exits. Already in the tree through tokio and sysinfo
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }
# atm's state folder (ADR-003 §2, approved): the platform's app data folder, as Tauri finds it
dirs = "7"
# The atm app (T-455, docs/guides/tauri.md; approved): Tauri 2.11.1 or later (CVE-2026-42184), one instance, and its
# commands' TypeScript types generated with tauri-specta. specta's crates are pre-releases, so pinned exactly
serde = { version = "1", features = ["derive"] }
tauri = "2.12.5"
tauri-build = "2.7.4"
# The app's build script fills Tauri's asset cache once, before the app is compiled twice at once by `cargo test` and
# `clippy --all-targets` (ATM-559, approved by Hakan 2026-11-17): the version tauri-macros uses, exactly, so its files
# are the ones generate_context! looks for. Already in the tree through Tauri
tauri-codegen = "=2.7.4"
tauri-plugin-single-instance = "2.5.5"
# The app's own updates (T-483, approved): Tauri's updater, its signed update manifest on each GitHub release. The
# system's TLS (native-tls: Security.framework on macOS) rather than rustls, whose root certificates come as a crate
# under a licence deny.toml doesn't list (webpki-root-certs, CDLA-Permissive-2.0)
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["native-tls", "system-proxy", "zip"] }
# The app's notifications of what needs the user (T-520, approved 2026-11-12): sent from Rust only, the page gets no
# permission of the plugin's; pinned to the newest release at least two weeks old then
tauri-plugin-notification = "=2.8.0"
# The page's external links in the user's browser (T-551, approved by Hakan 2026-11-16): opened from Rust only, by the
# app's `open_url` command, which checks the URL; the page gets no permission of the plugin's; pinned to the newest
# release at least two weeks old then
tauri-plugin-opener = "=2.7.2"
specta ={ version = "=2.0.0-rc.26", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
specta-typescript = "=0.0.13"
# The store's live changes (T-456, approved; atm-db's since T-555): the JSON store's watcher on its folders, its
# events debounced
notify = "8.2.1"
# A review's header (review.md's front matter, docs/code-review-design.md §3.3; approved by Hakan in the design
# review, ATM-562). Already in the tree through Tauri
toml = "1.2"
notify-debouncer-full = "0.7.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
