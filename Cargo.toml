# atm in Rust (T-415, docs/porting-to-rust.md): one crate per layer (docs/layered-architecture.md), so the compiler
# checks the layer rule. The rules: docs/guides/rust.md.
[workspace]
# The CLI's layers, and the atm app (T-455) on the same ones
members = ["crates/*", "app/src-tauri"]
resolver = "3"

[workspace.package]
# atm's version, the one source (T-477): the dashboard is stamped with it, and CHANGELOG.md and WHATS-NEW.md need an
# entry for it (dashboard/scripts/check-versions.mjs). The dashboard's About dialog shows the description, the author,
# the licence and the repository
version = "0.35.0"
description = "File-based task management for agentic development. Decompose requirements into tasks, execute them in loops, and watch progress on a live HTML dashboard."
authors = ["Hakan Serce <hakanserce@gmail.com>"]
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/solo-swe/agentic-task-manager"
publish = false

[workspace.dependencies]
atm-common = { path = "crates/atm-common" }
atm-db = { path = "crates/atm-db" }
atm-vcs = { path = "crates/atm-vcs" }
atm-lib = { path = "crates/atm-lib" }
atm-api = { path = "crates/atm-api" }
# CompMD in a Tauri app (ADR-004, T-503): CompMD's own plugin, its sandbox frames on a compmd: scheme, at
# content-hashed paths. Its version is @compmd/sandbox's (dashboard/package.json): they are released together
tauri-plugin-compmd = "=0.6.0"
clap = { version = "4.5", features = ["derive"] }
# Shell completion with atm's own values (task IDs, sprints, …), its dynamic engine (T-451, approved)
clap_complete = { version = "4.5", features = ["unstable-dynamic"] }
# JSON as atm writes it (docs/porting-to-rust.md §3): keys in the order they come, so a task prints as it is stored
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
# The lock (T-445): the host name and whether a lock's owner still runs; `claim hold`'s watcher follows its shell with it
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
# The lock is released when atm is stopped with SIGTERM, as the Python atm releases it (Unix only)
signal-hook = "0.4"
# The local time zone (TZ, /etc/localtime, the system's tz database), for sprints named by the time (T-471)
jiff = "0.2"
# `atm service`'s server (T-449, docs/porting-to-rust.md §3): HTTP/1 on localhost; the rest of atm stays synchronous
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "macros"] }
# Windows only (T-480, approved): atm's own standard handles made non-inheritable before it starts a background
# process, so the caller's pipes close when atm exits. Already in the tree through tokio and sysinfo
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }
# atm's state folder (ADR-003 §2, approved): the platform's app data folder, as Tauri finds it
dirs = "7"
# The atm app (T-455, docs/guides/tauri.md; approved): Tauri 2.11.1 or later (CVE-2026-42184), one instance, and its
# commands' TypeScript types generated with tauri-specta. specta's crates are pre-releases, so pinned exactly
serde = { version = "1", features = ["derive"] }
tauri = "2.12.5"
tauri-build = "2.7.4"
tauri-plugin-single-instance = "2.5.5"
# The app's own updates (T-483, approved): Tauri's updater, its signed update manifest on each GitHub release. The
# system's TLS (native-tls: Security.framework on macOS) rather than rustls, whose root certificates come as a crate
# under a licence deny.toml doesn't list (webpki-root-certs, CDLA-Permissive-2.0)
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["native-tls", "system-proxy", "zip"] }
# The app's notifications of what needs the user (T-520, approved 2026-11-12): sent from Rust only, the page gets no
# permission of the plugin's; pinned to the newest release at least two weeks old then
tauri-plugin-notification = "=2.8.0"
specta ={ version = "=2.0.0-rc.26", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
specta-typescript = "=0.0.13"
# The app's live changes (T-456, approved): a watcher on the folders the store reports, its events debounced
notify = "8.2.1"
notify-debouncer-full = "0.7.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
