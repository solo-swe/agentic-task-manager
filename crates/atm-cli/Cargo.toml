[package]
name = "atm-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "atm"
path = "src/main.rs"

[dependencies]
atm-common.workspace = true
atm-lib.workspace = true
# Only for `atm _serve`, the server process `atm service` starts: the binary is the server too (no second binary)
atm-api.workspace = true
clap.workspace = true
clap_complete.workspace = true
serde_json.workspace = true
# Other processes: the server's, a claim watcher's shell
sysinfo.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

# The workspace's lints, but `unsafe_code` denied rather than forbidden: one Windows-only function (`detach.rs`, T-480)
# calls the Windows API, with its own `#[allow]`. A `forbid` can't be allowed anywhere, and Cargo doesn't let a crate
# change one entry of the workspace's lints, so they are all here
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
