# cargo-deny (docs/guides/rust.md): licences, advisories, bans and sources for every dependency
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "BSD-3-Clause", "ISC", "Zlib"]
confidence-threshold = 0.9
# The list covers what the port's planned dependencies use (axum, tokio, serde, …), before they all come in
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
