# cargo-deny (docs/guides/rust.md): licences, advisories, bans and sources for every dependency
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# The atm app's tree (T-455, approved by Hakan): crates flagged unmaintained, with no vulnerability and no maintained
# version to move to yet. Each goes when the crate that brings it in moves on
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste: a compile-time macro helper of specta's (tauri-specta); nothing runs in the app" },
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: a compile-time helper of gtk-rs's macros, Linux only (Tauri's GTK webview)" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant: merged into zbus 6; zbus 5 is the single-instance plugin's D-Bus on Linux only" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names: merged into zbus 6; zbus 5 is the single-instance plugin's D-Bus on Linux only" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: merged into zbus 6; zbus 5 is the single-instance plugin's D-Bus on Linux only" },
]

[licenses]
version = 2
# BSD-2-Clause (Inflector, via specta) and MPL-2.0 (cssparser, selectors, dtoa-short via tauri-utils; option-ext via
# dirs) came with the atm app (T-455, approved by Hakan): used unmodified, MPL-2.0's copyleft is per file. CC0-1.0
# (notify, the app's watcher, T-456, approved): public domain
allow = [
  "CC0-1.0",
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "Unicode-3.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "Zlib",
]
confidence-threshold = 0.9
# The list covers what the port's planned dependencies use (axum, tokio, serde, …), before they all come in
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
