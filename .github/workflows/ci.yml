name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: Regenerate Linux screenshot baselines and upload them as an artifact
        type: boolean
        default: false

# The token can read the repository and nothing else: a compromised dependency running in a job can't push, open
# releases or change settings (docs/security-architecture.md I18)
permissions:
  contents: read

defaults:
  run:
    working-directory: dashboard

# Actions and images are pinned by commit SHA and digest (I19), pnpm by version; Dependabot (.github/dependabot.yml)
# proposes updates for the actions and the dashboard's packages (its npm ecosystem reads pnpm-lock.yaml). The images are updated by hand: the Playwright image must match @playwright/test's version.
jobs:
  check:
    name: Lint, unit tests, build freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # pnpm at the version the lockfile was written with, from the npm registry (no third-party action)
      - run: npm install --global pnpm@12.14.0
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-versions.mjs
      - run: pnpm run check
      - run: pnpm run build

  # atm (docs/porting-to-rust.md §5): the workspace on the three platforms its CLI ships for, and the suite
  # (tests/scripts/) against the binary. The runners' rustup installs the toolchain rust-toolchain.toml pins (no
  # third-party action); the scenarios' `sh` is Git's on Windows
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      # atm embeds the dashboard and CompMD's runtime, built first (dashboard/dist/, never committed: T-477)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install --global pnpm@12.14.0
      - run: pnpm install --frozen-lockfile
        working-directory: dashboard
      - run: pnpm run build
        working-directory: dashboard
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      # Licences, advisories, bans and sources of every dependency (cargo-deny at a pinned version, from crates.io)
      - name: cargo-deny
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deny --locked --version 0.20.2
          cargo deny check
      - name: The suite
        run: node tests/scripts/run.mjs
      # Large task files (1k and 10k tasks): fails only far over generous limits (tests/scripts/bench.mjs)
      - name: Benchmark atm
        if: runner.os == 'Linux'
        run: node tests/scripts/bench.mjs --cli --check

  # The binary the e2e job's fixture runs (its task views and summaries are atm's own): built on the oldest Ubuntu the
  # release supports, so it runs in the Playwright image too
  atm-linux:
    name: atm for the e2e suite
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install --global pnpm@12.14.0
      - run: pnpm install --frozen-lockfile
        working-directory: dashboard
      - run: pnpm run build
        working-directory: dashboard
      - run: cargo build --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atm-linux
          path: target/debug/atm
          if-no-files-found: error

  e2e:
    name: Playwright regression suite
    needs: atm-linux
    runs-on: ubuntu-latest
    # Pinned image = pinned fonts/rendering, so Linux screenshot baselines are reproducible
    container: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm install --global pnpm@12.14.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # The fixture's atm (tests/e2e/helpers.ts), from the job above; an artifact keeps no file mode
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: atm-linux
          path: target/debug
      - run: chmod +x ../target/debug/atm
      # Baselines are per platform. Any macOS baseline without a Linux counterpart (new, or deleted because the UI
      # changed on purpose) is generated here in the pinned container, uploaded, and the job fails until the
      # generated files are committed. update-snapshots regenerates all Linux baselines.
      - name: Check for missing Linux screenshot baselines
        id: baselines
        shell: bash
        run: |
          missing=0
          for f in $(find tests/e2e/__screenshots__ -name '*-darwin.png'); do
            [ -f "${f%-darwin.png}-linux.png" ] || { echo "missing: ${f%-darwin.png}-linux.png"; missing=1; }
          done
          if [ "${{ inputs.update-snapshots }}" = "true" ]; then mode=all; elif [ $missing = 1 ]; then mode=missing; else mode=none; fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "generate=$([ $mode = none ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
      - name: Generate screenshot baselines
        if: steps.baselines.outputs.generate == 'true'
        run: pnpm exec playwright test visual --update-snapshots=${{ steps.baselines.outputs.mode }}
      # Only the Linux baselines: whoever downloads it extracts nothing else (docs/security-review.md F16)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.baselines.outputs.generate == 'true'
        with:
          name: linux-screenshot-baselines
          path: dashboard/tests/e2e/__screenshots__/**/*-linux.png
      - name: Baselines must be committed
        if: steps.baselines.outputs.generate == 'true'
        run: |
          echo "::error::Linux screenshot baselines were generated, not compared. Download the linux-screenshot-baselines artifact, commit its new *-linux.png files under dashboard/tests/e2e/__screenshots__/, and push."
          exit 1
      - name: Run e2e tests
        if: steps.baselines.outputs.generate == 'false'
        run: pnpm exec playwright test
      - name: Benchmark the dashboard
        if: steps.baselines.outputs.generate == 'false'
        run: pnpm run bench --dashboard --check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: |
            dashboard/playwright-report/
            dashboard/test-results/
