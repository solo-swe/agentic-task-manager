name: Homebrew

# When a release is published (releases start as drafts, release.yml), point the atm formula and the atm app's cask in
# solo-swe/homebrew-tap at it: Formula/atm.rb and Casks/atm-app.rb, from the release's SHA256SUMS
# (packaging/homebrew-formula.sh, homebrew-cask.sh). Run it by hand with a tag to publish them for an existing release.
# Needs HOMEBREW_TAP_DEPLOY_KEY (packaging/README.md).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.33.0"
        required: true

permissions:
  contents: read

jobs:
  formula:
    runs-on: ubuntu-latest
    # Pre-releases aren't what `brew install` should get
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The release's checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --pattern SHA256SUMS --dir "$RUNNER_TEMP" --repo "$GITHUB_REPOSITORY"
      - name: Update the formula in the tap
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          version="${TAG#v}"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/tap-key"
          chmod 600 "$RUNNER_TEMP/tap-key"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/tap-key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:solo-swe/homebrew-tap.git "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Formula" "$RUNNER_TEMP/tap/Casks"
          sh packaging/homebrew-formula.sh "$version" "$RUNNER_TEMP/SHA256SUMS" > "$RUNNER_TEMP/tap/Formula/atm.rb"
          sh packaging/homebrew-cask.sh "$version" "$RUNNER_TEMP/SHA256SUMS" > "$RUNNER_TEMP/tap/Casks/atm-app.rb"
          cd "$RUNNER_TEMP/tap"
          git add Formula/atm.rb Casks/atm-app.rb
          if git diff --cached --quiet; then
            echo "The formula is already at $version"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "atm and atm-app $version"
            git push
          fi
          rm "$RUNNER_TEMP/tap-key"
