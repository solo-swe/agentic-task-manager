    <script>
      // Apply the stored theme and light/dark mode before the first paint (no flash of the wrong mode). Same rules as
      // src/lib/appearance.ts; the preferences live in localStorage "atm-dashboard" (src/lib/prefs.ts).
      (function () {
        var prefs = {};
        try {
          prefs = JSON.parse(localStorage.getItem('atm-dashboard') || '{}') || {};
        } catch (e) {}
        var mode = prefs.mode === 'light' || prefs.mode === 'dark' ? prefs.mode : null;
        if (!mode) mode = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = typeof prefs.theme === 'string' ? prefs.theme : 'default';
        document.documentElement.dataset.mode = mode;
      })();
    </script>

The short version, for people using atm. The full list of changes, for developers, is in CHANGELOG.md.

## [0.31.0] - 2026-11-06

- atm's commands are grouped by what they act on, and one command moves a task to any state: fewer to remember.
- Approving, rejecting or asking for changes on a review is always your decision, and a task leaves review only by it.
- Your shell can complete atm's commands, task IDs and sprint names as you type.
- Nothing to install: everything atm needs comes with the plugin.
- atm never runs commands for an agent: agents run their own, each with your permission rules.
- Every dashboard page and every task has its own address, so you can bookmark and share them; old links still work.

## [0.30.0] - 2026-11-04

- Markdown documents show a number for every line, beside its text, as code does; a link to a line marks just that line.
- Clicking a card on the Omniboard opens the task right there, without leaving the board.
- Files inside a git submodule open in the document viewer too.
- A long contents list stays readable and scrolls.
- Agents can commit a whole generated folder at once, such as a rebuilt runtime.

## [0.29.0] - 2026-11-03

- Files and documents a task links to open right in the dashboard, in a window you can move and resize.
- A link can point at lines of code or a sentence in a document: it opens there, marked.
- Code is highlighted, math is typeset, and documents show line numbers and a contents list.
- Pick how documents look: your theme's page, GitHub, Docs or Magazine.
- Requirements and use cases are listed one per line, and link to where they are defined.

## [0.28.0] - 2026-11-03

- Task descriptions and notes look richer: tables, checklists, nested lists and callouts render as they should.
- Diagrams written in task text are drawn, in light or dark to match the dashboard.
- A task's text can show the task's own live values, such as its status, so they never go stale.
- Agents know what they can write, so the tasks they create read better.
- Help and What's new look like task text, and keep their title in view as you scroll.
- What's new shows the latest releases, with a link to all the others.

## [0.27.0] - 2026-11-03

- A task file with mistakes in it no longer blanks the dashboard: it keeps showing your tasks, and tells you what's wrong.
- The dashboard and atm now agree on what's ready, what waits and how each task is reviewed, also for tasks in other worktrees.
- Tasks waiting only on archived work show as ready.
- When two agents grab the same task at the same moment, exactly one gets it.
- A detached checkout shows its commit wherever a branch would be, instead of nothing.

## [0.26.0] - 2026-11-02

- The Projects Overview has Activity, Progress and Agents views of all your projects together, each project in its own colour.
- Project cards show at a glance what is being worked on, what comes next and what needs you.
- Task List cards show more: how a task starts, how it ended, who worked on it and for how long.
- The dependency graph keeps the tasks you're looking at in view as you filter, and glides to each new view.
- The all-projects board shows exactly your active sprints' tasks, and "needs you" counts only what you can act on now.
- Archived tasks are one click away, and the overview counts them in its numbers.

## [0.25.0] - 2026-11-01

- The board opens on the active sprint, with its goal, due date and progress, and hints for what to do next.
- The task list groups tasks by sprint, label or component, so planning from the backlog is one view.
- See each sprint's velocity, and how far each part of your project has come.
- Search and filters now sit in the title bar, leaving more room for your tasks.
- Share a link that opens the board on a sprint.
- Tasks reopened after their sprint closed are flagged, so no work gets lost.

## [0.24.0] - 2026-10-31

- Phases are now sprints: plan one with a goal and a due date, and agents work through it, then close it and carry what's left.
- See what each release holds and what's still missing, with a notes draft to copy when it ships.
- Choose how work is reviewed: right away, as it goes, or all together at the end of the sprint.
- Mark the work you want to do yourself with an agent, and unattended loops leave it for you.
- The board's "Next up" is always the task the agent really takes next.
- A task's details show how it ended and the tasks it's related to or duplicates.

## [0.23.0] - 2026-10-30

- The Kanban board keeps all its columns when you filter by status, so the board doesn't change shape.
- Grey out finished tasks in the dependency graph with the new "Dim done" button, to see what's left.
- The dependency graph is laid out more clearly: chains run in straight lines, with fewer crossing arrows.
- Hover a task in the dependency graph to light up everything it waits for.
- A new Sticky notes theme: your Kanban on a blackboard or a whiteboard, with tasks as colourful sticky notes.
- A new Hand-drawn theme: your Kanban sketched in pencil on a notebook page, or in white pen on a black one.

## [0.22.0] - 2026-10-27

- A task's details no longer show a scrollbar: the title stays put, and hints say when there's more above or below.
- Jump around a task's details from the new handles on the left: Info, Dependencies, Notes, Activity and Ref.
- Dependencies in a task's details fit on one line each.
- What's new scrolls the same way, without a scrollbar.

\`.agentic-task-manager/tasks.json\`, live: it reloads every 5 seconds while agents work through the tasks (and does
nothing when nothing changed). It only reads the files; agents and the \`atm\` command change them.

Jump to: [your projects](#your-projects), [the views](#views), [filters and saved views](#filters-and-saved-views),
[statuses](#statuses-and-kinds), [waiting on you](#waiting-on-you), [priorities and labels](#priorities-and-labels),

[the archive](#the-archive),
[the skills](#the-skills), [agents in parallel](#running-agents-in-parallel).

## Your projects

- **The arrow next to the title** switches projects. Type to filter the list; a bar shows each project's progress and
  a dot marks the ones with something waiting for you. A badge on the arrow counts what waits for you in the other
  projects.
- **All projects** (first in that list) shows a card per project: its progress, the phase it is in, the agents at work,
  what needs you and when it last moved. Click a card to open the project, or its "need you" to see those tasks on its
  Kanban board. **Active only** hides projects with nothing open and nothing done in the last two weeks.
- A project appears here once atm has run in it. \`atm projects\` lists them, and \`atm projects remove\` takes one off.
- Updating the plugin updates this dashboard: when a new version is ready, a bar offers to reload.

## The top bar

- **Progress** — the share of tasks done. Click it for the split by status, phase and type.
- **Activity** — tasks completed over time. Click it for the details: completions by type, agents at work, time per
  task and idle stretches, for a period you choose.
- **N need you** — tasks waiting for your review or for your answer. Click it for the Kanban board.
- **Refresh** — reload now, or change how often the dashboard reloads by itself.
- **Appearance** — light or dark mode, one of 11 themes, picked from a drop-down list, and the document viewer's
  style.

## Views

- **Dependency Graph** — tasks as boxes, in the order their dependencies allow. Drag to move, use the buttons or
  Ctrl/⌘ + scroll to zoom. Click a task for its details.
- **Kanban Board** — a column per status. To Do shows which tasks are ready and which one the loop takes next.
  Group the board by phase, or show skipped tasks, with the options above it.
- **Task List** — every task as a card, in the file's order or by priority.
- **Agents** — who worked on what, and when: a lane per agent (🤖) or person (👤), with a bar per task. A green mark
  at the end of a bar means someone else completed it, usually a reviewer approving it. Zoom and move the time range,
  or tick **Live** to follow the current time.
- **Progress** — each phase's progress and an estimate of the agent work left, a burndown chart, and how busy the
  agents have been.

## Filters and saved views

**Filters** narrows every view by phase, type, status, priority, stage, label and who started the task (the last
three appear when the project uses them); the search box matches task IDs, names, descriptions, types and labels.
Within a group, any selected value matches; across groups, all must match. Each button says how many tasks it would
show.

The dashboard remembers your filters, search, tab and options **per project**, so they are back the next time you
open it. **Reset view** forgets them.

## Statuses and kinds

Each status has a **kind**, which decides what it means:

- **To Do** (kind \`todo\`) — not started.
- **In Progress** (\`active\`) — an agent is working on it.
- **In Review** (\`review\`) — the work is finished and waits for approval by you or another agent. Cards say how long
  it has waited. It doesn't count as agent work.
- **Blocked** (\`blocked\`) — it can't go on until someone decides something (below).
- **Done** (\`done\`) — finished. Only done tasks let the tasks that depend on them start.
- **Skipped** (\`skipped\`) — won't be done.

A project can name its own statuses in \`tasks.json\`; they look like the built-in status of their kind. **About**
lists the ones this project uses.

## Waiting on you

An agent that can't go on without a decision asks instead of guessing: the task is **Blocked**, and its card says
**Waiting on you** (or **on an agent**), for how long, and how many questions. The task's details list the questions.
Answer them in Claude Code, or with \`atm unblock <id> --answer "…"\` (one answer per question); the task goes back to
To Do with your answers attached for the next agent.

A task **In Review** waits for you to look at it: pass it with \`atm done <id>\`, or send it back with
\`atm reject <id> --reason "…"\`.

## Priorities and labels

Agents take tasks phase by phase and, within a phase, the most urgent first:

- **P0** Critical / Required
- **P1** High
- **P2** Medium (tasks without a priority count as this)
- **P3** Low / Nice to have

**Labels** are tags that group tasks across phases and types, such as \`spike-2\` or \`ux\`. They show as small chips on
the cards, and the filter and the search find them.

## The task details

Click a task for everything about it: its description, what it depends on and what depends on it, and

- **Who** — who created it, started it and completed it, and who worked on it before (from their handoffs);
- **Notes** — newest first: handoffs from an agent that had to stop, the outcome, review requests and rejections,
  your answers, and failures;
- **Commit** — the commit that holds the task's work.

Descriptions, notes and questions are written in [CompMD](https://compmd.hakanserce.com/), Markdown with components,
and render as (this Help and What's new render with CompMD too):

- **Markdown and GFM** — headings, lists (nested too), tables, task lists, code, quotes, alerts, footnotes and links;
- **Code and math** — a code block is highlighted by its language (\` \`\`\`ts \`), in light or dark with the dashboard;
  \`$x^2$\` and a \`$$ … $$\` block are typeset as math;
- **Diagrams** — a \`mermaid\` code block draws a diagram with [Mermaid](https://mermaid.js.org/), in light or dark
  with the dashboard, in a sandboxed frame;
- **The task's own values** — \`{{md.data.task.status}}\` shows the task's status as it is now;
- **References** — a link to a file of the project opens it in the document viewer; a requirement, a use case or a
  sentence linked by its text (a link ending in \`#:~:text=…\`) opens the document there, marked;
- **As written** — anything the dashboard won't run: scripts, raw HTML, images from elsewhere.

A diagram is a fenced code block whose language is \`mermaid\`, holding the diagram's source, such as:

\`\`\`
flowchart LR
  todo[To do] --> active[In progress] --> done[Done]
\`\`\`

In a \`mermaid\` fence, it draws:

\`\`\`mermaid {alt="To do, then In progress, then Done"}
flowchart LR
  todo[To do] --> active[In progress] --> done[Done]
\`\`\`

## Documents

A task's files and the documents it refers to open in the **document viewer**, a window over the task's details:

- **What opens it** — a link to a file of the project in a description or note (\`docs/design.md\`, from the
  project's root), a link inside an open document (from that document's folder), and every entry of the task's
  **Files** list;
- **Where it opens** — at a heading (\`docs/design.md#routes\`), at lines of code (\`src/app.ts#L40-L45\`, marked in the
  line numbers), or at a piece of text (a link ending in \`#:~:text=…\`, marked until you click);
- **What it shows** — Markdown rendered as task text is, code and text files with their line numbers, images; it
  follows the file as it changes, without losing your place. Hidden files, files git ignores and key files aren't
  shown;
- **The window** — drag its title bar to move it and its corner to resize it (or the arrow keys, Shift to resize); it
  keeps its place. **Copy path** copies the file's path with its lines, for an agent; **Open on GitHub** shows the
  file in the repository. **‹** goes back to the document before, **×** closes it;
- **Its look** — **Document style** in the settings menu, under the theme: **Auto** writes the document on the
  theme's own page, **GitHub** as a README, **Docs** in a narrow serif column for reading, **Magazine** with display
  headings and a drop cap. Each follows light and dark mode.

## Workflows and stages

A project pushes its work in one of two ways (**About** shows which; \`/atm:push\` asks the first time):

- **direct** — commits go straight to the main branch.
- **pull-request** — work goes to a branch and reaches the main branch through a pull request.

A done task can be further along: **In PR** (its pull request is open; the card links to it) and **Merged**. In a
pull-request project the Done column is split into these stages. Stages never hold anything up: the tasks that
depend on a task can start as soon as it is done.

## The archive

Finished tasks pile up. \`atm archive\` moves old ones to \`tasks-archive.json\`, so \`tasks.json\` stays small and quick
to read; agents do it when \`atm\` suggests it, and the footer says when the file has grown big enough. The header
counts the archived tasks.

The dashboard reads the archive only when you need it: the **Progress** tab and the activity details count archived
work, and **Include archived** in the filter bar adds the archived tasks to the search, the lists, the graph and the
Agents tab. A task that depends on an archived one shows it as "archived, done".

## The skills

Run these in Claude Code:

- \`/atm:create-tasks\` — turn your requirements into tasks.
- \`/atm:do-task\` — do one task: the next available one, or the one you name.
- \`/atm:loop-tasks\` — keep doing tasks until none is left.
- \`/atm:push\` — push the work (or open its pull request), watch CI and fix what fails.
- \`/atm:serve\` — start or stop this dashboard's server, one for all your projects.

## Running agents in parallel

Several agents can work on one project at once, in one checkout or in separate git worktrees: each agent claims the
task it works on, so no two take the same task, and the Kanban board shows who works on what. The board shows every
worktree of the project at once: a task is shown as it is on the branch where it got furthest, and a branch chip on
its card names that branch when it isn't the main worktree's. See
[Running agents in parallel](https://github.com/solo-swe/agentic-task-manager#running-agents-in-parallel) in the
README.
