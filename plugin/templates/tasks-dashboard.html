d are flagged, so no work gets lost.`]}]},{version:`0.24.0`,date:`2026-10-31`,sections:[{title:``,items:[`Phases are now sprints: plan one with a goal and a due date, and agents work through it, then close it and carry what's left.`,`See what each release holds and what's still missing, with a notes draft to copy when it ships.`,`Choose how work is reviewed: right away, as it goes, or all together at the end of the sprint.`,`Mark the work you want to do yourself with an agent, and unattended loops leave it for you.`,`The board's "Next up" is always the task the agent really takes next.`,`A task's details show how it ended and the tasks it's related to or duplicates.`]}]},{version:`0.23.0`,date:`2026-10-30`,sections:[{title:``,items:[`The Kanban board keeps all its columns when you filter by status, so the board doesn't change shape.`,`Grey out finished tasks in the dependency graph with the new "Dim done" button, to see what's left.`,`The dependency graph is laid out more clearly: chains run in straight lines, with fewer crossing arrows.`,`Hover a task in the dependency graph to light up everything it waits for.`,`A new Sticky notes theme: your Kanban on a blackboard or a whiteboard, with tasks as colourful sticky notes.`,`A new Hand-drawn theme: your Kanban sketched in pencil on a notebook page, or in white pen on a black one.`]}]},{version:`0.22.0`,date:`2026-10-27`,sections:[{title:``,items:[`A task's details no longer show a scrollbar: the title stays put, and hints say when there's more above or below.`,`Jump around a task's details from the new handles on the left: Info, Dependencies, Notes, Activity and Ref.`,`Dependencies in a task's details fit on one line each.`,`What's new scrolls the same way, without a scrollbar.`]}]},{version:`0.21.0`,date:`2026-10-27`,sections:[{title:``,items:[`atm moved to github.com/solo-swe/agentic-task-manager. Installed it before? Remove the old marketplace and add the new one, as the README explains.`,`Shorter titles: "Projects Overview" for all projects, and just the project's name on each project.`,`The Activity details no longer mix up the period you picked with the size of the bars.`,`A tidier Project tab: no extra line under the name, and its two panels line up.`,`The board of all your projects is now the Omniboard. It fits your window, and long columns scroll on their own, like a project's Kanban.`]}]},{version:`0.20.0`,date:`2026-10-27`,sections:[{title:``,items:[`All projects has a Board tab: what's being worked on, waiting for you and just finished, across every project, with a search box.`,`A new Project tab shows who works on a project, its vocabulary, and stats such as agent time and how long tasks take.`,`Activity and Progress now show where the time went: agents working, waiting on you, or idle.`,`The Kanban opens first and no longer makes the page scroll; long columns show how many more cards are above or below.`,`atm is hardened against hostile task files and repositories, and agents treat task text as information, not commands.`]}]},{version:`0.19.0`,date:`2026-10-26`,sections:[{title:``,items:[`Notes, questions and answers show formatting: code, lists, bold text and links.`,`The Kanban uses your whole screen height, so you see more cards before scrolling.`,`Long or many labels on a Kanban card stay on one line; click "+N" to see them all.`,`With many phases, the Phase filter shows only the active ones, with a button for the finished ones.`,`The About dialog names the project you're looking at, with its logo.`,`The Idle number in Activity fits on one line, and its colour now matches the charts.`]}]},{version:`0.18.0`,date:`2026-10-26`,sections:[{title:``,items:[`Project cards show what agents are working on right now, by task name, or what comes next.`,`Each card shows its branch and latest pull request, with a link.`,`See the last task each project finished, and how long ago.`,`The cards are laid out the same way, so a row of projects lines up neatly.`]}]},{version:`0.17.0`,date:`2026-10-26`,sections:[{title:``,items:[`Your projects can have logos: on their cards, in the project selector and next to the title.`,`Project cards show rings for the phases you're working on, and line up neatly.`,`"Needs you" takes you straight to the task waiting for you, or lists them.`,`"Active phases only" now shows what's in progress plus the phase you just finished, and is on by default.`,`Agents working in parallel no longer take each other's tasks, and a question answered once counts everywhere.`]}]},{version:`0.16.0`,date:`2026-10-26`,sections:[{title:``,items:[`Agents working in separate git worktrees all show on one board, each task with the branch it's on.`,`Commits and pull requests in a task's details link to GitHub, GitLab, Bitbucket or Codeberg.`,`Progress leaves out skipped tasks, so a phase with only skipped tasks left counts as finished.`,`Task details show when work started, when it finished and how long it took.`,`When an agent's time on a task ran out, it now says so and how to carry on.`]}]},{version:`0.15.0`,date:`2026-10-25`,sections:[{title:``,items:[`One dashboard now shows all your projects: switch between them with the arrow next to the title.`,`**All projects** shows every project at a glance: its progress, what it's working on, and what needs you.`,`The dashboard comes with the plugin, so updating the plugin updates it. No more updating each project.`,`When a new version is ready, the open dashboard offers to reload.`,"Open it with `/atm:serve`, which you only need once for all your projects."]}]},{version:`0.14.0`,date:`2026-10-25`,sections:[{title:``,items:[`Five more colour themes: Ayu, Night Owl, Gruvbox, Noctis and Sublime Material, each in light and dark.`,`Pick a theme with the arrow keys; the menu opens on the one you use.`,`The Progress tab can show only the phases you're working on, hiding ones finished a while ago.`,`Task descriptions show formatting: headings, lists, code and links.`,`Activity titles say which period you picked, such as "this week".`,`What's new (this list) is now short and written for you; the full details stay in the changelog.`]}]},{version:`0.13.0`,date:`2026-10-24`,sections:[{title:``,items:[`Agents can ask you a question instead of guessing, or hand finished work to you for review. The dashboard tells you when a task needs you.`,"Push your work and get CI green with `/atm:push`, straight to your main branch or through a pull request.",`Tasks can have priorities and labels, and your project can name its own statuses, phases and types.`,`Each task shows who created, started and finished it, notes from the agents, and its pull request.`,`Old finished tasks can be archived, so big projects stay fast.`,`Help and About in the footer explain the dashboard.`]}]},{version:`0.12.0`,date:`2026-10-24`,sections:[{title:``,items:[`Light and dark mode, and six colour themes.`,`A new top bar with your progress and recent activity; click either for the details.`,`Search tasks by keyword, and see how many tasks each filter would show.`,`An Agents tab shows who worked on what, and when.`,`The dashboard remembers your filters, tab and view for each project.`]}]},{version:`0.11.0`,date:`2026-10-23`,sections:[{title:``,items:[`Several agents can work on one project at once without getting in each other's way.`,`The dashboard shows which agent is working on each task.`,`Branches that changed different tasks now merge cleanly.`]}]},{version:`0.10.0`,date:`2026-10-23`,sections:[{title:``,items:["`/atm:serve` starts the dashboard for you in the background.","Everything atm needs now lives in one folder in your project, `.agentic-task-manager/`.",`atm now needs Python 3.9 or newer, which macOS already has with its developer tools.`]}]},{version:`0.9.0`,date:`2026-10-23`,sections:[{title:``,items:[`A Progress tab with a burndown chart and an estimate of the work left in each phase.`]}]},{version:`0.8.0`,date:`2026-10-23`,sections:[{title:``,items:[`A Kanban board, with a "Next up" marker on the task the agent will pick next.`]}]},{version:`0.7.0`,date:`2026-10-22`,sections:[{title:``,items:[`This What's new panel.`,`The dashboard refreshes itself every 5 seconds by default.`]}]},{version:`0.6.0`,date:`2026-10-22`,sections:[{title:``,items:[`Zoom and pan the dependency graph, with a minimap for large ones.`]}]},{version:`0.5.0`,date:`2026-10-22`,sections:[{title:``,items:[`A rebuilt dashboard that looks the same, and is now tested automatically.`]}]},{version:`0.4.0`,date:`2026-04-05`,sections:[{title:``,items:["An activity timeline, and `/atm:update-dashboard` to get the latest dashboard."]}]},{version:`0.3.0`,date:`2026-04-04`,sections:[{title:``,items:[`Internal changes only.`]}]},{version:`0.2.0`,date:`2026-04-04`,sections:[{title:``,items:["The plugin is now called `atm`: `/atm:create-tasks`, `/atm:do-task`, `/atm:loop-tasks`."]}]},{version:`0.1.0`,date:`2026-04-03`,sections:[{title:``,items:[`First release: turn requirements into tasks, let agents work through them, and watch it all on a live dashboard.`]}]}];function lo(e=document){return e.querySelector(`meta[name="atm-dashboard-version"]`)?.content||void 0}function uo(e=document){return e.querySelector(`meta[name="atm-dashboard-build"]`)?.content||void 0}var fo=[`todo`,`active`,`review`,`blocked`,`done`,`skipped`],po=[{id:`todo`,label:`To Do`,kind:`todo`},{id:`in_progress`,label:`In Progress`,kind:`active`},{id:`in_review`,label:`In Review`,kind:`review`},{id:`blocked`,label:`Blocked`,kind:`blocked`},{id:`done`,label:`Done`,kind:`done`},{id:`skipped`,label:`Skipped`,kind:`skipped`}],mo=[`feature`,`bugfix`,`test`,`infra`,`docs`,`refactor`,`polish`].map(e=>({id:e,label:_o(e)})),ho=[{id:`P0`,label:`Critical`},{id:`P1`,label:`High`},{id:`P2`,label:`Medium`},{id:`P3`,label:`Low`}],go={statuses:po,types:mo,priorities:ho,defaultPriority:`P2`,phaseNames:new Map,labels:[]};function _o(e){return e.charAt(0).toUpperCase()+e.slice(1)}function vo(e){return _o(e.replace(/_/g,` `))}var yo=e=>typ t`,text:` — every task as a card, in the file's order or by priority.`}],[{t:`strong`,children:[{t:`text`,text:`Agents`}]},{t:`text`,text:` — who worked on what, and when: a lane per agent (🤖) or person (👤), with a bar per task. A green mark at the end of a bar means someone else completed it, usually a reviewer approving it. Zoom and move the time range, or tick `},{t:`strong`,children:[{t:`text`,text:`Live`}]},{t:`text`,text:` to follow the current time.`}],[{t:`strong`,children:[{t:`text`,text:`Progress`}]},{t:`text`,text:` — each phase's progress and an estimate of the agent work left, a burndown chart, and how busy the agents have been.`}]]},{t:`heading`,level:2,id:`filters-and-saved-views`,children:[{t:`text`,text:`Filters and saved views`}]},{t:`paragraph`,children:[{t:`strong`,children:[{t:`text`,text:`Filters`}]},{t:`text`,text:` narrows every view by phase, type, status, priority, stage, label and who started the task (the last three appear when the project uses them); the search box matches task IDs, names, descriptions, types and labels. Within a group, any selected value matches; across groups, all must match. Each button says how many tasks it would show.`}]},{t:`paragraph`,children:[{t:`text`,text:`The dashboard remembers your filters, search, tab and options `},{t:`strong`,children:[{t:`text`,text:`per project`}]},{t:`text`,text:`, so they are back the next time you open it. `},{t:`strong`,children:[{t:`text`,text:`Reset view`}]},{t:`text`,text:` forgets them.`}]},{t:`heading`,level:2,id:`statuses-and-kinds`,children:[{t:`text`,text:`Statuses and kinds`}]},{t:`paragraph`,children:[{t:`text`,text:`Each status has a `},{t:`strong`,children:[{t:`text`,text:`kind`}]},{t:`text`,text:`, which decides what it means:`}]},{t:`list`,ordered:!1,items:[[{t:`strong`,children:[{t:`text`,text:`To Do`}]},{t:`text`,text:` (kind `},{t:`code`,text:`todo`},{t:`text`,text:`) — not started.`}],[{t:`strong`,children:[{t:`text`,text:`In Progress`}]},{t:`text`,text:` (`},{t:`code`,text:`active`},{t:`text`,text:`) — an agent is working on it.`}],[{t:`strong`,children:[{t:`text`,text:`In Review`}]},{t:`text`,text:` (`},{t:`code`,text:`review`},{t:`text`,text:`) — the work is finished and waits for approval by you or another agent. Cards say how long it has waited. It doesn't count as agent work.`}],[{t:`strong`,children:[{t:`text`,text:`Blocked`}]},{t:`text`,text:` (`},{t:`code`,text:`blocked`},{t:`text`,text:`) — it can't go on until someone decides something (below).`}],[{t:`strong`,children:[{t:`text`,text:`Done`}]},{t:`text`,text:` (`},{t:`code`,text:`done`},{t:`text`,text:`) — finished. Only done tasks let the tasks that depend on them start.`}],[{t:`strong`,children:[{t:`text`,text:`Skipped`}]},{t:`text`,text:` (`},{t:`code`,text:`skipped`},{t:`text`,text:`) — won't be done.`}]]},{t:`paragraph`,children:[{t:`text`,text:`A project can name its own statuses in `},{t:`code`,text:`tasks.json`},{t:`text`,text:`; they look like the built-in status of their kind. `},{t:`strong`,children:[{t:`text`,text:`About`}]},{t:`text`,text:` lists the ones this project uses.`}]},{t:`heading`,level:2,id:`waiting-on-you`,children:[{t:`text`,text:`Waiting on you`}]},{t:`paragraph`,children:[{t:`text`,text:`An agent that can't go on without a decision asks instead of guessing: the task is `},{t:`strong`,children:[{t:`text`,text:`Blocked`}]},{t:`text`,text:`, and its card says `},{t:`strong`,children:[{t:`text`,text:`Waiting on you`}]},{t:`text`,text:` (or `},{t:`strong`,children:[{t:`text`,text:`on an agent`}]},{t:`text`,text:`), for how long, and how many questions. The task's details list the questions. Answer them in Claude Code, or with `},{t:`code`,text:`atm unblock <id> --answer "…"`},{t:`text`,text:` (one answer per question); the task goes back to To Do with your answers attached for the next agent.`}]},{t:`paragraph`,children:[{t:`text`,text:`A task `},{t:`strong`,children:[{t:`text`,text:`In Review`}]},{t:`text`,text:` waits for you to look at it: pass it with `},{t:`code`,text:`atm done <id>`},{t:`text`,text:`, or send it back with `},{t:`code`,text:`atm reject <id> --reason "…"`},{t:`text`,text:`.`}]},{t:`heading`,level:2,id:`priorities-and-labels`,children:[{t:`text`,text:`Priorities and labels`}]},{t:`paragraph`,children:[{t:`text`,text:`Agents take tasks phase by phase and, within a phase, the most urgent first:`}]},{t:`list`,ordered:!1,items:[[{t:`strong`,children:[{t:`text`,text:`P0`}]},{t:`text`,text:` Critical / Required`}],[{t:`strong`,children:[{t:`text`,text:`P1`}]},{t:`text`,text:` High`}],[{t:`strong`,children:[{t:`text`,text:`P2`}]},{t:`text`,text:` Medium (tasks without a priority count as this)`}],[{t:`strong`,children:[{t:`text`,text:`P3`}]},{t:`text`,text:` Low / Nice to have`}]]},{t:`paragraph`,children:[{t:`strong`,children:[{t:`text`,text:`Labels`}]},{t:`text`,text:` are tags that group tasks across phases and types, such as `},{t:`code`,text:`spike-2`},{t:`text`,text:` or `},{t:`code`,text:`ux`},{t:`text`,text:`. They show as small chips on the cards, and the filter and the search find them.`}]},{t:`heading`,level:2,id:`the-task-details`,children:[{t:`text`,text:`The task details`}]},{t:`paragraph`,children:[{t:`text`,text:`Click a task for everything about it: its description, what it depends on and what depends on it, and`}]},{t:`list`,ordered:!1,items:[[{t:`strong`,children:[{t:`text`,text:`Who`}]},{t:`text`,text:` — who created it, started it and completed it, and who worked on it before (from their handoffs);`}],[{t:`strong`,children:[{t:`text`,text:`Notes`}]},{t:`text`,text:` — newest first: handoffs from an agent that had to stop, the outcome, review requests and rejections, your answers, and failures;`}],[{t:`strong`,children:[{t:`text`,text:`Commit`}]},{t:`text`,text:` — the commit that holds the task's work.`}]]},{t:`heading`,level:2,id:`workflows-and-stages`,children:[{t:`text`,text:`Workflows and stages`}]},{t:`paragraph`,children:[{t:`text`,text:`A project pushes its work in one of two ways (`},{t:`strong`,children:[{t:`text`,text:`About`}]},{t:`text`,text:` shows which; `},{t:`code`,text:`/atm:push`},{t:`text`,text:` asks the first time):`}]},{t:`list`,ordered:!1,items:[[{t:`strong`,children:[{t:`text`,text:`direct`}]},{t:`text`,text:` — commits go straight to the main branch.`}],[{t:`strong`,children:[{t:`text`,text:`pull-request`}]},{t:`text`,text:` — work goes to a branch and reaches the main branch through a pull request.`}]]},{t:`paragraph`,children:[{t:`text`,text:`A done task can be further along: `},{t:`strong`,children:[{t:`text`,text:`In PR`}]},{t:`text`,text:` (its pull request is open; the card links to it) and `},{t:`strong`,children:[{t:`text`,text:`Merged`}]},{t:`text`,text:`. In a pull-request project the Done column is split into these stages. Stages never hold anything up: the tasks that depend on a task can start as soon as it is done.`}]},{t:`heading`,level:2,id:`the-archive`,children:[{t:`text`,text:`The archive`}]},{t:`paragraph`,children:[{t:`text`,text:`Finished tasks pile up. `},{t:`code`,text:`atm archive`},{t:`text`,text:` moves old ones to `},{t:`code`,text:`tasks-archive.json`},{t:`text`,text:`, so `},{t:`code`,text:`tasks.json`},{t:`text`,text:` stays small and quick to read; agents do it when `},{t:`code`,text:`atm`},{t:`text`,text:` suggests it, and the footer says when the file has grown big enough. The header counts the archived tasks.`}]},{t:`paragraph`,children:[{t:`text`,text:`The dashboard reads the archive only when you need it: the `},{t:`strong`,children:[{t:`text`,text:`Progress`}]},{t:`text`,text:` tab and the activity details count archived work, and `},{t:`strong`,children:[{t:`text`,text:`Include archived`}]},{t:`text`,text:` in the filter bar adds the archived tasks to the search, the lists, the graph and the Agents tab. A task that depends on an archived one shows it as "archived, done".`}]},{t:`heading`,level:2,id:`the-skills`,children:[{t:`text`,text:`The skills`}]},{t:`paragraph`,children:[{t:`text`,text:`Run these in Claude Code:`}]},{t:`list`,ordered:!1,items:[[{t:`code`,text:`/atm:create-tasks`},{t:`text`,text:` — turn your requirements into tasks.`}],[{t:`code`,text:`/atm:do-task`},{t:`text`,text:` — do one task: the next available one, or the one you name.`}],[{t:`code`,text:`/atm:loop-tasks`},{t:`text`,text:` — keep doing tasks until none is left.`}],[{t:`code`,text:`/atm:push`},{t:`text`,text:` — push the work (or open its pull request), watch CI and fix what fails.`}],[{t:`code`,text:`/atm:serve`},{t:`text`,text:` — start or stop this dashboard's server, one for all your projects.`}]]},{t:`heading`,level:2,id:`running-agents-in-parallel`,children:[{t:`text`,text:`Running agents in parallel`}]},{t:`paragraph`,children:[{t:`text`,text:`Several agents can work on one project at once, in one checkout or in separate git worktrees: each agent claims the task it works on, so no two take the same task, and the Kanban board shows who works on what. The board shows every worktree of the project at once: a task is shown as it is on the branch where it got furthest, and a branch chip on its card names that branch when it isn't the main worktree's. See `},{t:`link`,href:`https://github.com/solo-swe/agentic-task-manager#running-agents-in-parallel`,children:[{t:`text`,text:`Running agents in parallel`}]},{t:`text`,text:` in the README.`}]}];function Hw(e,t){N(t,!1),oa();{let t=mt(()=>$.dialog===`help`);Lw(e,{id:`help`,title:`Help`,get open(){return U(t)},onclose:()=>$.closeDialog(),children:(e,t)=>{hC(e,{get blocks(){return Vw},idPrefix:`help-`})},$$slots:{default:!0}})}P()}var Uw=[`active`,`all`];function Ww(e,t){let n=e.missing?null:e.summary;return n?t===`active`&&`board_active_sprint`in n?n.board_active_sprint??null:n.board??null:null}function Gw(e,t){return t===`active`?e.filter(e=>!e.missing&&e.summary&&`board_active_sprint`in e.summary&&!e.summary.board_active_sprint):[]}var Kw=[{id:`todo`,label:`To Do · ready`,empty:`Nothing ready to start
